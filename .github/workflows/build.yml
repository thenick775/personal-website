name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  change-detect:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      duplicate_check: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: "true"
          concurrent_skipping: "always"
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule", "merge_group"]'

  build:
    name: Build
    needs: change-detect
    if: needs.change-detect.outputs.duplicate_check != 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run astro check

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run stylelint

      - name: Dead code
        run: npm run knip

      - name: Format check
        run: npm run format

      - name: Build
        run: npm run build

      - name: Upload Visualizer Report
        uses: actions/upload-artifact@v7
        with:
          name: bundle-stats
          path: ./stats.html
